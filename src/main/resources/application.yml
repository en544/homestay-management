server:
  port: 8080

spring:
  application:
    name: homestay-management
  datasource:
    url: jdbc:h2:file:./data/homestay;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

app:
  admin:
    username: admin
    password: 123456
    display-name: 林店长

logging:
  level:
    org.hibernate.SQL: warn
