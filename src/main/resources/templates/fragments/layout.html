<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153a35">
    <title th:text="${title} + ' · 栖居民宿管理'">栖居民宿管理</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="sidebar-brand" th:href="@{/}">
        <span class="brand-mark"><i data-lucide="mountain"></i></span>
        <span class="sidebar-brand-text">
            <strong class="brand-name">栖居民宿</strong>
            <small class="brand-subtitle">QIJU STAY MANAGEMENT</small>
        </span>
    </a>
    <nav class="sidebar-nav">
        <span class="nav-label">经营中心</span>
        <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/}">
            <i data-lucide="layout-dashboard"></i><span>经营概览</span>
        </a>
        <a class="nav-link" th:classappend="${active == 'homestays'} ? ' active' : ''" th:href="@{/homestays}">
            <i data-lucide="house"></i><span>门店房源</span>
        </a>
        <a class="nav-link" th:classappend="${active == 'rooms'} ? ' active' : ''" th:href="@{/rooms}">
            <i data-lucide="bed-double"></i><span>房态管理</span>
        </a>
        <a class="nav-link" th:classappend="${active == 'orders'} ? ' active' : ''" th:href="@{/orders}">
            <i data-lucide="receipt-text"></i><span>订单中心</span>
        </a>
        <a class="nav-link" th:classappend="${active == 'reviews'} ? ' active' : ''" th:href="@{/reviews}">
            <i data-lucide="message-square-text"></i><span>住客评价</span>
        </a>
        <span class="nav-label" style="margin-top: 14px;">快捷操作</span>
        <a class="nav-link" th:href="@{/bookings/new}">
            <i data-lucide="calendar-plus"></i><span>新建预订</span>
        </a>
        <a class="nav-link" th:href="@{/rooms/new}">
            <i data-lucide="plus-square"></i><span>新增房型</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <span class="avatar">林</span>
            <span class="sidebar-user-meta">
                <strong th:text="${adminName}">林店长</strong>
                <small>门店管理员</small>
            </span>
            <form th:action="@{/logout}" method="post">
                <button class="icon-button sidebar-logout" type="submit" title="退出登录" aria-label="退出登录">
                    <i data-lucide="log-out"></i>
                </button>
            </form>
        </div>
    </div>
</aside>
<header class="topbar" th:fragment="topbar(title, subtitle)">
    <div class="topbar-title">
        <h1 th:text="${title}">经营概览</h1>
        <p th:text="${subtitle}">今天的民宿经营情况</p>
    </div>
    <div class="topbar-meta">
        <span class="date-chip">
            <i data-lucide="calendar-days"></i>
            <span th:text="${#temporals.format(today, 'yyyy年MM月dd日')}">2026年10月22日</span>
        </span>
        <a class="icon-button" th:href="@{/orders}" title="查看待处理订单" aria-label="查看订单">
            <i data-lucide="bell"></i>
        </a>
    </div>
</header>
<div th:fragment="flash">
    <div class="alert alert-success" th:if="${successMessage}" data-dismiss>
        <i data-lucide="circle-check"></i><span th:text="${successMessage}">操作成功</span>
    </div>
    <div class="alert alert-error" th:if="${errorMessage}" data-dismiss>
        <i data-lucide="circle-alert"></i><span th:text="${errorMessage}">操作失败</span>
    </div>
</div>
<nav class="mobile-nav" th:fragment="mobileNav(active)">
    <a th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/}">
        <i data-lucide="layout-dashboard"></i><span>概览</span>
    </a>
    <a th:classappend="${active == 'homestays'} ? ' active' : ''" th:href="@{/homestays}">
        <i data-lucide="house"></i><span>门店</span>
    </a>
    <a th:classappend="${active == 'rooms'} ? ' active' : ''" th:href="@{/rooms}">
        <i data-lucide="bed-double"></i><span>房态</span>
    </a>
    <a th:classappend="${active == 'orders'} ? ' active' : ''" th:href="@{/orders}">
        <i data-lucide="receipt-text"></i><span>订单</span>
    </a>
    <a th:classappend="${active == 'reviews'} ? ' active' : ''" th:href="@{/reviews}">
        <i data-lucide="message-square-text"></i><span>评价</span>
    </a>
</nav>
<th:block th:fragment="scripts">
    <script th:src="@{/js/lucide.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
