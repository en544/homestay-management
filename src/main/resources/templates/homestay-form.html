<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing ? '编辑门店' : '新增门店'})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('homestays')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar(${editing ? '编辑门店' : '新增门店'}, '维护对外展示的门店档案')}"></header>
        <main class="page">
            <section class="page-heading">
                <div>
                    <span class="eyebrow">STAY PROFILE</span>
                    <h2 th:text="${editing ? '更新门店档案' : '添加一家新门店'}">添加一家新门店</h2>
                    <p>门店名称、地址与封面会展示在房源列表中，请尽量填写真实且有辨识度的信息。</p>
                </div>
                <a class="button" th:href="@{/homestays}">
                    <i data-lucide="arrow-left"></i> 返回门店列表
                </a>
            </section>

            <form class="form-layout" th:action="@{/homestays}" th:object="${homestayForm}" method="post">
                <section class="form-panel">
                    <h3 class="form-section-title"><i data-lucide="house"></i> 基础信息</h3>
                    <input type="hidden" th:field="*{id}">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="name">门店名称 <span class="required">*</span></label>
                            <input class="form-control" id="name" type="text" th:field="*{name}" placeholder="例如：云栖山居">
                            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="city">所在城市 <span class="required">*</span></label>
                            <input class="form-control" id="city" type="text" th:field="*{city}" placeholder="例如：湖州">
                            <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                        </div>
                        <div class="form-group full">
                            <label class="form-label" for="address">详细地址 <span class="required">*</span></label>
                            <input class="form-control" id="address" type="text" th:field="*{address}" placeholder="省 / 市 / 县 / 村">
                            <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                        </div>
                        <div class="form-group full">
                            <label class="form-label" for="summary">一句话介绍 <span class="required">*</span></label>
                            <input class="form-control" id="summary" type="text" th:field="*{summary}"
                                   placeholder="用一句有画面感的话介绍门店">
                            <span class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></span>
                        </div>
                        <div class="form-group full">
                            <label class="form-label" for="description">门店详情</label>
                            <textarea class="form-textarea" id="description" th:field="*{description}"
                                      placeholder="介绍空间特色、周边体验、交通与服务"></textarea>
                            <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                        </div>
                    </div>

                    <h3 class="form-section-title" style="margin-top: 28px;"><i data-lucide="image"></i> 展示配置</h3>
                    <div class="form-grid">
                        <div class="form-group full">
                            <label class="form-label" for="coverImage">封面图片地址 <span class="required">*</span></label>
                            <input class="form-control" id="coverImage" type="text" th:field="*{coverImage}"
                                   placeholder="/images/stay-1.jpg">
                            <p class="form-hint">课程项目已内置 3 张门店图片，可填写 /images/stay-1.jpg 至 stay-3.jpg。</p>
                            <span class="field-error" th:if="${#fields.hasErrors('coverImage')}" th:errors="*{coverImage}"></span>
                        </div>
                        <div class="form-group full">
                            <label class="form-label" for="tags">特色标签 <small>使用英文逗号分隔</small></label>
                            <input class="form-control" id="tags" type="text" th:field="*{tags}"
                                   placeholder="竹海景观,山野早餐,围炉煮茶">
                            <span class="field-error" th:if="${#fields.hasErrors('tags')}" th:errors="*{tags}"></span>
                        </div>
                        <div class="form-group full">
                            <label class="form-label" for="active">营业状态</label>
                            <label style="display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);">
                                <input id="active" type="checkbox" th:field="*{active}">
                                <span>启用该门店并允许创建新预订</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="button button-ghost" th:href="@{/homestays}">取消</a>
                        <button class="button button-primary" type="submit">
                            <i data-lucide="save"></i>
                            <span th:text="${editing ? '保存修改' : '创建门店'}">创建门店</span>
                        </button>
                    </div>
                </section>

                <aside class="panel" style="overflow:hidden;">
                    <div style="padding: 20px 20px 14px; border-bottom: 1px solid var(--line);">
                        <span class="eyebrow">LIVE PREVIEW</span>
                        <h3 style="margin:3px 0 0;font-family:'Songti SC',serif;font-size:18px;">展示预览</h3>
                    </div>
                    <img style="width:100%;height:210px;object-fit:cover;" id="coverPreview"
                         th:src="${homestayForm.coverImage != null && !homestayForm.coverImage.isBlank() ? homestayForm.coverImage : '/images/stay-1.jpg'}"
                         alt="封面预览">
                    <div style="padding:18px;">
                        <strong id="namePreview" style="font-family:'Songti SC',serif;font-size:20px;"
                                th:text="${homestayForm.name != null && !homestayForm.name.isBlank() ? homestayForm.name : '门店名称'}">门店名称</strong>
                        <p id="summaryPreview" style="margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.8;"
                           th:text="${homestayForm.summary != null && !homestayForm.summary.isBlank() ? homestayForm.summary : '用一句话介绍你的门店。'}">介绍</p>
                    </div>
                </aside>
            </form>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/layout :: mobileNav('homestays')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    (function () {
        var cover = document.getElementById("coverImage");
        var preview = document.getElementById("coverPreview");
        var name = document.getElementById("name");
        var namePreview = document.getElementById("namePreview");
        var summary = document.getElementById("summary");
        var summaryPreview = document.getElementById("summaryPreview");
        if (cover && preview) cover.addEventListener("input", function () { preview.src = cover.value; });
        if (name && namePreview) name.addEventListener("input", function () {
            namePreview.textContent = name.value || "门店名称";
        });
        if (summary && summaryPreview) summary.addEventListener("input", function () {
            summaryPreview.textContent = summary.value || "用一句话介绍你的门店。";
        });
    })();
</script>
</body>
</html>
